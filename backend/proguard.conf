# ProGuard 混淆配置 - GetJobs 后端

# ===== 基本配置 =====
# 保留行号信息（便于调试）
-renamesourcefileattribute SourceFile
-keepattributes SourceFile,LineNumberTable

# 保留注解
-keepattributes *Annotation*,Signature,InnerClasses,EnclosingMethod

# 保留枚举
-keepclassmembers enum * {
    public static **[] values();
    public static ** valueOf(java.lang.String);
}

# ===== Spring Boot 相关保留 =====
# 保留 Spring Boot 启动类
-keep class com.getjobs.GetJobsApplication {
    public static void main(java.lang.String[]);
}

# 保留 Spring 注解
-keep @org.springframework.stereotype.* class *
-keep @org.springframework.web.bind.annotation.* class *
-keep @org.springframework.boot.autoconfigure.* class *
-keep @org.springframework.context.annotation.* class *
-keep @org.springframework.context.annotation.Configuration class *

# 保留 Controller 方法和参数名
-keepclassmembers class * {
    @org.springframework.web.bind.annotation.RequestMapping *;
    @org.springframework.web.bind.annotation.GetMapping *;
    @org.springframework.web.bind.annotation.PostMapping *;
    @org.springframework.web.bind.annotation.PutMapping *;
    @org.springframework.web.bind.annotation.DeleteMapping *;
    @org.springframework.web.bind.annotation.PatchMapping *;
}

# 保留 Spring Security 配置
-keep class com.getjobs.application.config.SecurityConfig { *; }

# ===== MyBatis-Plus 相关保留 =====
# 保留实体类
-keep class com.getjobs.domain.entity.** { *; }
-keep class com.getjobs.**.entity.** { *; }

# 保留 Mapper 接口
-keep interface com.getjobs.infrastructure.persistence.**Mapper
-keep interface com.getjobs.**.mapper.**Mapper

# 保留 Service 实现
-keep class com.getjobs.**.service.impl.** { *; }

# ===== Jackson JSON 序列化保留 =====
# 保留 getter/setter（JSON 序列化需要）
-keepclassmembers public class * {
    void set*(***);
    *** get*();
    *** is*();
}

# ===== Playwright 相关保留 =====
# 保留 Playwright 相关类
-keep class com.microsoft.playwright.** { *; }
-dontwarn com.microsoft.playwright.**

# ===== 数据库相关保留 =====
# 保留 JDBC 驱动
-keep class org.sqlite.** { *; }
-dontwarn org.sqlite.**

# ===== 反射和动态调用保留 =====
# 保留所有公共方法（Spring 依赖注入需要）
-keepclassmembers public class * {
    public <methods>;
}

# 保留构造函数
-keepclassmembers class * {
    public <init>(...);
}

# ===== 配置文件和静态资源 =====
# 不混淆 resources 目录
-keepdirectories META-INF
-keepdirectories org

# ===== 优化选项 =====
# 关闭优化（避免 Spring 动态代理问题）
-dontoptimize

# 忽略警告（Spring Boot 等库有很多重复类警告）
-ignorewarnings
-dontwarn

# 不警告第三方库
-dontwarn org.springframework.**
-dontwarn com.baomidou.**
-dontwarn org.apache.**
-dontwarn com.fasterxml.jackson.**
-dontwarn io.jsonwebtoken.**

# 不压缩（保持所有类）
-dontshrink

# ===== 日志保留 =====
# 保留日志相关类
-keep class org.slf4j.** { *; }
-dontwarn org.slf4j.**

# ===== 其他第三方库 =====
-keep class org.json.** { *; }
-dontwarn org.json.**

-keep class io.github.cdimascio.dotenv.** { *; }
-dontwarn io.github.cdimascio.dotenv.**
