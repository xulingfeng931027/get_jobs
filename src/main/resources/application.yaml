spring:
  application:
    name: get_jobs
  profiles:
    active: dev
  info:
    app:
      name: Get Jobs
      version: 0.0.1-SNAPSHOT
      description: https://github.com/loks666/get_jobs
  banner:
    charset: UTF-8
    location: classpath:banner.txt
  datasource:
    url: jdbc:mysql://43.143.182.159:6033/get_jobs?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: app_user
    password: 7hxUKgrA7x6D!FZwHLFz
    hikari:
      maximum-pool-size: 10
      connection-test-query: SELECT 1
      idle-timeout: 600000
      max-lifetime: 1800000
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: true
  output:
    ansi:
      enabled: always

# 服务器配置
server:
  port: 18888  # 后端 API 固定端口

# 日志配置
logging:
  level:
    root: INFO
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr([%thread]){magenta} %clr(%-5level){highlight} %clr(%logger{36}){cyan} %clr(-){faint} %msg%n"
  file:
    name: ./target/logs/get-jobs.log
  logback:
    rollingpolicy:
      max-history: 30
      max-file-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: true  # 打开 MyBatis Plus 启动 banner
    db-config:
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml

# 后台管理系统 JWT 配置
