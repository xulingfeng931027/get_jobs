spring:
  application:
    name: get_jobs
  profiles:
    active: dev
  info:
    app:
      name: Get Jobs
      version: 0.0.1-SNAPSHOT
  banner:
    charset: UTF-8
    location: classpath:banner.txt
  datasource:
    url: jdbc:mysql://43.143.182.159:6033/get_jobs?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: app_user
    password: 7hxUKgrA7x6D!FZwHLFz
    hikari:
      maximum-pool-size: 10
      connection-test-query: SELECT 1
      idle-timeout: 600000
      max-lifetime: 1800000
  output:
    ansi:
      enabled: always

# 服务器配置
server:
  port: 18888  # 后端 API 固定端口

# 日志配置
logging:
  level:
    root: INFO
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr([%thread]){magenta} %clr(%-5level){highlight} %clr(%logger{36}){cyan} %clr(-){faint} %msg%n"
  file:
    name: ./target/logs/get-jobs.log
  logback:
    rollingpolicy:
      max-history: 30
      max-file-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: true  # 打开 MyBatis Plus 启动 banner
    db-config:
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml

# 后台管理系统 JWT 配置
admin:
  jwt:
    secret: ${ADMIN_JWT_SECRET:G3tJ0bs-Adm1n-Secr3t-K3y-2025!@#}
    expiration: 86400000  # 24小时（毫秒）
    issuer: get-jobs-admin

# Playwright Agent 配置
playwright:
  # 性能调优
  slow-mo: 20                    # 操作延迟（毫秒），原 50
  navigation-timeout: 30000      # 默认导航超时
  login-check-interval: 5000     # 登录检测间隔（毫秒），原 3000
  
  # 平台差异化超时
  platforms:
    boss:
      navigation-timeout: 30000
    liepin:
      navigation-timeout: 35000
    job51:
      navigation-timeout: 40000
    zhilian:
      navigation-timeout: 35000
  
  # 稳定性
  max-retries: 3
  retry-base-delay: 1000
  retry-max-delay: 10000
  health-check-interval: 10000   # 浏览器健康检查间隔
  
  # 资源管理
  max-pages: 4
  idle-page-timeout: 300000      # 空闲页面回收时间（5分钟）
  resource-blocking-enabled: false # 请求拦截（默认关闭）
  
  # Cookie 管理
  cookie-refresh-before-expiry: 3600000  # 过期前1小时刷新
